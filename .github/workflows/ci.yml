name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports src
      - name: Tests with coverage (fails under 80%)
        run: pytest -q --cov=flaky_hunter --cov-report=term-missing --cov-fail-under=80 --junitxml=reports/junit.xml
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

  # Dogfooding: run the Action on the example data so the README demo is always real.
  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          junit: examples/runs/*.xml
          cache-key-prefix: demo-${{ github.run_id }}
